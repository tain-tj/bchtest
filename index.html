<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ: Sepsis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white p-4 rounded-lg shadow-lg">กำลังประมวลผล...</div>
    </div>

    <!-- หน้าลงทะเบียน -->
    <div id="register-page" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">แบบทดสอบ Sepsis</h2>
        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">รหัสพนักงาน (6 หลัก)</label>
                <input type="text" id="emp-id" placeholder="ตัวอย่าง: 012345" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล</label>
                <input type="text" id="emp-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">แผนก / หน่วยงาน</label>
                <select id="emp-dept" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    <option value="">-- เลือกแผนก --</option>
                    <option value="OPD">ผู้ป่วยนอก (OPD)</option>
                    <option value="IPD">ผู้ป่วยใน (IPD)</option>
                    <option value="ER">ฉุกเฉิน (ER)</option>
                    <option value="ICU">ไอซียู (ICU)</option>
                    <option value="Office">สายสนับสนุน/สำนักงาน</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ประเภทแบบทดสอบ</label>
                <select id="test-type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    <option value="Pretest">ก่อนอบรม (Pretest)</option>
                    <option value="Posttest">หลังอบรม (Posttest)</option>
                </select>
            </div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
                เริ่มทำข้อสอบ
            </button>
        </form>
    </div>

    <!-- หน้าทำข้อสอบ -->
    <div id="quiz-page" class="hidden bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <span id="question-counter" class="text-gray-500 font-medium">ข้อ 1/5</span>
            <span id="timer" class="text-red-500 font-bold bg-red-100 px-3 py-1 rounded-full">60 วิ</span>
        </div>
        <h3 id="question-text" class="text-lg font-semibold text-gray-800 mb-4"></h3>
        <div id="choices-container" class="space-y-3">
            <!-- ตัวเลือกจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- หน้าแสดงผลคะแนน -->
    <div id="result-page" class="hidden bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h2 class="text-3xl font-bold text-green-600 mb-2">เสร็จสิ้น!</h2>
        <p class="text-gray-600 mb-6">บันทึกข้อมูลการทดสอบเรียบร้อยแล้ว</p>
        <div class="bg-blue-50 p-6 rounded-lg mb-6">
            <p class="text-sm text-gray-500">คะแนนของคุณ</p>
            <p id="score-display" class="text-4xl font-bold text-blue-700 mt-2">0/5</p>
        </div>
        <button onclick="location.reload()" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-600 hover:bg-gray-700">
            กลับหน้าหลัก
        </button>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwt4SbdflHth8PEGd8lZ6ZVlg30QJ6JcFegwOCmqTKjRdFu5SDqQsZ8JIiHfAFrktf4/exec'; // ใส่ URL จาก Google Apps Script

        const quizData = [
            {
                q: "ข้อใดอธิบายภาวะ Sepsis ได้เหมาะสมที่สุด?",
                choices: [
                    "มีไข้สูงจากการติดเชื้อทุกกรณี",
                    "มีการติดเชื้อหรือสงสัยติดเชื้อร่วมกับอวัยวะเริ่มทำงานผิดปกติ",
                    "มีความดันโลหิตสูงร่วมกับชีพจรเร็ว",
                    "มีแผลติดเชื้อเฉพาะที่โดยไม่มีอาการผิดปกติอื่น"
                ],
                ans: "มีการติดเชื้อหรือสงสัยติดเชื้อร่วมกับอวัยวะเริ่มทำงานผิดปกติ"
            },
            {
                q: "ผู้ป่วยสงสัยติดเชื้อ มีอาการซึมลง หายใจเร็ว และความดันตัวบน 88 mmHg การปฏิบัติแรกที่เหมาะสมที่สุดคือข้อใด?",
                choices: [
                    "รอดูอาการอีก 4 ชั่วโมง",
                    "ให้ผู้ป่วยรับประทานอาหารและน้ำมาก ๆ",
                    "ประเมิน ABCDE วัดสัญญาณชีพซ้ำ และแจ้งพยาบาลวิชาชีพ/แพทย์ทันที",
                    "ให้ยาปฏิชีวนะที่มีอยู่ในหอผู้ป่วยทันทีโดยไม่ต้องรายงาน"
                ],
                ans: "ประเมิน ABCDE วัดสัญญาณชีพซ้ำ และแจ้งพยาบาลวิชาชีพ/แพทย์ทันที"
            },
            {
                q: "ข้อใดเป็นสัญญาณเตือนที่ควรรีบแจ้งทีมดูแล?",
                choices: [
                    "หายใจเร็ว RR > 22 ครั้ง/นาที",
                    "สับสนหรือปลุกยาก",
                    "ปัสสาวะลดลง ปลายมือเท้าเย็น",
                    "ถูกทุกข้อ"
                ],
                ans: "ถูกทุกข้อ"
            },
            {
                q: "เกี่ยวกับการเก็บเลือดเพาะเชื้อและการให้ยาปฏิชีวนะ ข้อใดถูกต้องที่สุด?",
                choices: [
                    "ต้องรอผลเพาะเชื้อก่อนจึงเริ่มยาปฏิชีวนะเสมอ",
                    "เก็บสิ่งส่งตรวจ/เลือดเพาะเชื้อตามแผนการรักษาก่อนยาปฏิชีวนะ หากทำได้โดยไม่ทำให้การรักษาล่าช้า",
                    "ผู้ช่วยสามารถเลือกและปรับยาปฏิชีวนะเองได้",
                    "ไม่จำเป็นต้องบันทึกเวลาเริ่มสงสัย Sepsis"
                ],
                ans: "เก็บสิ่งส่งตรวจ/เลือดเพาะเชื้อตามแผนการรักษาก่อนยาปฏิชีวนะ หากทำได้โดยไม่ทำให้การรักษาล่าช้า"
            },
            {
                q: "ข้อใดเป็นสิ่งที่ควรติดตามและบันทึกอย่างใกล้ชิดในผู้ป่วยสงสัย Sepsis?",
                choices: [
                    "ระดับความรู้สึกตัวและความดันโลหิต",
                    "อัตราการหายใจและค่า SpO2",
                    "ปริมาณปัสสาวะและการไหลเวียนปลายมือปลายเท้า",
                    "ถูกทุกข้อ"
                ],
                ans: "ถูกทุกข้อ"
            }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 60;
        let userData = {};

        // ฟังก์ชันสลับ Array (Fisher-Yates Shuffle)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const empId = document.getElementById('emp-id').value;
            
            // ตรวจสอบรหัสพนักงาน 6 หลักและขึ้นต้นด้วย 0
            if (!/^0\d{5}$/.test(empId)) {
                alert("กรุณาระบุรหัสพนักงานให้ถูกต้อง (ต้องเป็นตัวเลข 6 หลัก และขึ้นต้นด้วย 0)");
                return;
            }

            userData = {
                empId: empId,
                name: document.getElementById('emp-name').value,
                department: document.getElementById('emp-dept').value,
                testType: document.getElementById('test-type').value
            };

            document.getElementById('loading').classList.remove('hidden');

            try {
                // ตรวจสอบสิทธิ์ว่าเคยสอบหรือยัง
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "check", ...userData })
                });
                const result = await response.json();
                
                document.getElementById('loading').classList.add('hidden');

                if (result.status === 'duplicate') {
                    alert(`รหัสพนักงาน ${empId} ได้ทำการสอบ ${userData.testType} ไปแล้ว ไม่สามารถทำซ้ำได้`);
                    return;
                }

                startQuiz();
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
            }
        });

        function startQuiz() {
            document.getElementById('register-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            
            // คัดลอกและสลับข้อสอบ
            currentQuestions = shuffle(JSON.parse(JSON.stringify(quizData)));
            currentQuestionIndex = 0;
            score = 0;
            
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 60;
            document.getElementById('timer').innerText = `${timeLeft} วิ`;
            
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('question-counter').innerText = `ข้อ ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-text').innerText = q.q;

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            // สลับตัวเลือก
            const shuffledChoices = shuffle([...q.choices]);
            
            shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-lg border border-gray-300 hover:bg-blue-50 hover:border-blue-400 transition-colors duration-200 text-gray-700";
                btn.innerText = choice;
                btn.onclick = () => selectAnswer(choice, q.ans);
                choicesContainer.appendChild(btn);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `${timeLeft} วิ`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion(); // หมดเวลาให้ข้ามข้อและไม่ได้คะแนน
                }
            }, 1000);
        }

        function selectAnswer(selected, correct) {
            clearInterval(timerInterval);
            if (selected === correct) score++;
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        async function finishQuiz() {
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            userData.score = score;

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "save", ...userData })
                });
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-page').classList.remove('hidden');
                document.getElementById('score-display').innerText = `${score}/${currentQuestions.length}`;
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert("ไม่สามารถบันทึกคะแนนได้ กรุณาติดต่อผู้ดูแลระบบ");
            }
        }
    </script>
</body>
</html>
