<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ: Sepsis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .hidden { display: none; }
        /* ปรับแต่ง SweetAlert ให้เข้ากับฟอนต์ Prompt */
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-3"></i>
            <span class="text-gray-700 font-medium">กำลังประมวลผล...</span>
        </div>
    </div>

    <!-- หน้าลงทะเบียน -->
    <div id="register-page" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-6">
            <div class="inline-block p-4 bg-blue-100 rounded-full mb-3">
                <i class="fas fa-file-medical text-3xl text-blue-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">แบบทดสอบ Sepsis</h2>
            <p class="text-sm text-gray-500 mt-1">กรุณากรอกข้อมูลก่อนเริ่มทำแบบทดสอบ</p>
        </div>

        <form id="register-form" class="space-y-4">
            <!-- รหัสพนักงาน -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสพนักงาน (6 หลัก)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-id-badge text-gray-400"></i>
                    </div>
                    <input type="text" id="emp-id" placeholder="ตัวอย่าง: 012345" class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
            </div>
            
            <!-- ชื่อ-นามสกุล -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="emp-name" placeholder="ระบุชื่อและนามสกุล" class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
            </div>

            <!-- แผนก -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">แผนก / หน่วยงาน</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-hospital-user text-gray-400"></i>
                    </div>
                    <input type="text" id="emp-dept" placeholder="โปรดระบุแผนก" class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
            </div>

            <!-- ประเภทแบบทดสอบ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทแบบทดสอบ</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-clipboard-list text-gray-400"></i>
                    </div>
                    <select id="test-type" class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white" required>
                        <option value="Pretest">ก่อนอบรม (Pretest)</option>
                        <option value="Posttest">หลังอบรม (Posttest)</option>
                    </select>
                    <!-- Custom Arrow for Select -->
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i class="fas fa-chevron-down text-gray-400 text-sm"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center items-center py-3 px-4 mt-6 border border-transparent rounded-lg shadow-md text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                <i class="fas fa-play-circle mr-2"></i> เริ่มทำข้อสอบ
            </button>
        </form>
    </div>

    <!-- หน้าทำข้อสอบ -->
    <div id="quiz-page" class="hidden bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <span id="question-counter" class="text-gray-600 font-semibold text-lg">
                <i class="fas fa-question-circle text-blue-500 mr-1"></i> ข้อ 1/5
            </span>
            <span id="timer" class="flex items-center text-red-600 font-bold bg-red-50 border border-red-200 px-4 py-1.5 rounded-full shadow-sm">
                <i class="fas fa-stopwatch mr-2 text-lg"></i> <span id="time-text">60 วิ</span>
            </span>
        </div>
        <h3 id="question-text" class="text-lg md:text-xl font-medium text-gray-800 mb-6 leading-relaxed"></h3>
        <div id="choices-container" class="space-y-3">
            <!-- ตัวเลือกจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- หน้าแสดงผลคะแนน -->
    <div id="result-page" class="hidden bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <div class="inline-block p-5 bg-green-100 rounded-full mb-4">
            <i class="fas fa-trophy text-5xl text-green-500"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 mb-2">เสร็จสิ้นการทดสอบ!</h2>
        <p class="text-gray-500 mb-6">บันทึกข้อมูลการทดสอบของคุณเรียบร้อยแล้ว</p>
        
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 p-6 rounded-xl mb-8">
            <p class="text-sm font-medium text-gray-600 uppercase tracking-wider mb-1">คะแนนที่ได้</p>
            <div class="flex justify-center items-baseline text-blue-700">
                <span id="score-display" class="text-5xl font-extrabold">0</span>
                <span class="text-2xl font-bold text-gray-400 mx-1">/</span>
                <span id="total-display" class="text-2xl font-bold text-gray-400">5</span>
            </div>
        </div>
        
        <button onclick="location.reload()" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-medium text-white bg-gray-700 hover:bg-gray-800 transition-colors">
            <i class="fas fa-home mr-2"></i> กลับหน้าหลัก
        </button>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwt4SbdflHth8PEGd8lZ6ZVlg30QJ6JcFegwOCmqTKjRdFu5SDqQsZ8JIiHfAFrktf4/exec'; // ใส่ URL จาก Google Apps Script

        const quizData = [
            {
                q: "ข้อใดอธิบายภาวะ Sepsis ได้เหมาะสมที่สุด?",
                choices: [
                    "มีไข้สูงจากการติดเชื้อทุกกรณี",
                    "มีการติดเชื้อหรือสงสัยติดเชื้อร่วมกับอวัยวะเริ่มทำงานผิดปกติ",
                    "มีความดันโลหิตสูงร่วมกับชีพจรเร็ว",
                    "มีแผลติดเชื้อเฉพาะที่โดยไม่มีอาการผิดปกติอื่น"
                ],
                ans: "มีการติดเชื้อหรือสงสัยติดเชื้อร่วมกับอวัยวะเริ่มทำงานผิดปกติ"
            },
            {
                q: "ผู้ป่วยสงสัยติดเชื้อ มีอาการซึมลง หายใจเร็ว และความดันตัวบน 88 mmHg การปฏิบัติแรกที่เหมาะสมที่สุดคือข้อใด?",
                choices: [
                    "รอดูอาการอีก 4 ชั่วโมง",
                    "ให้ผู้ป่วยรับประทานอาหารและน้ำมาก ๆ",
                    "ประเมิน ABCDE วัดสัญญาณชีพซ้ำ และแจ้งพยาบาลวิชาชีพ/แพทย์ทันที",
                    "ให้ยาปฏิชีวนะที่มีอยู่ในหอผู้ป่วยทันทีโดยไม่ต้องรายงาน"
                ],
                ans: "ประเมิน ABCDE วัดสัญญาณชีพซ้ำ และแจ้งพยาบาลวิชาชีพ/แพทย์ทันที"
            },
            {
                q: "ข้อใดเป็นสัญญาณเตือนที่ควรรีบแจ้งทีมดูแล?",
                choices: [
                    "หายใจเร็ว RR > 22 ครั้ง/นาที",
                    "สับสนหรือปลุกยาก",
                    "ปัสสาวะลดลง ปลายมือเท้าเย็น",
                    "ถูกทุกข้อ"
                ],
                ans: "ถูกทุกข้อ"
            },
            {
                q: "เกี่ยวกับการเก็บเลือดเพาะเชื้อและการให้ยาปฏิชีวนะ ข้อใดถูกต้องที่สุด?",
                choices: [
                    "ต้องรอผลเพาะเชื้อก่อนจึงเริ่มยาปฏิชีวนะเสมอ",
                    "เก็บสิ่งส่งตรวจ/เลือดเพาะเชื้อตามแผนการรักษาก่อนยาปฏิชีวนะ หากทำได้โดยไม่ทำให้การรักษาล่าช้า",
                    "ผู้ช่วยสามารถเลือกและปรับยาปฏิชีวนะเองได้",
                    "ไม่จำเป็นต้องบันทึกเวลาเริ่มสงสัย Sepsis"
                ],
                ans: "เก็บสิ่งส่งตรวจ/เลือดเพาะเชื้อตามแผนการรักษาก่อนยาปฏิชีวนะ หากทำได้โดยไม่ทำให้การรักษาล่าช้า"
            },
            {
                q: "ข้อใดเป็นสิ่งที่ควรติดตามและบันทึกอย่างใกล้ชิดในผู้ป่วยสงสัย Sepsis?",
                choices: [
                    "ระดับความรู้สึกตัวและความดันโลหิต",
                    "อัตราการหายใจและค่า SpO2",
                    "ปริมาณปัสสาวะและการไหลเวียนปลายมือปลายเท้า",
                    "ถูกทุกข้อ"
                ],
                ans: "ถูกทุกข้อ"
            }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 60;
        let userData = {};

        // โหลดข้อมูลประวัติการสอบไว้ล่วงหน้า
        let completedTestsPromise = fetch(GAS_URL).then(res => res.json()).catch(() => []);

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const empId = document.getElementById('emp-id').value.trim();
            
            if (!/^0\d{5}$/.test(empId)) {
                Swal.fire({
                    icon: 'error',
                    title: 'ข้อมูลไม่ถูกต้อง',
                    text: 'กรุณาระบุรหัสพนักงานให้ถูกต้อง (ต้องเป็นตัวเลข 6 หลัก และขึ้นต้นด้วย 0)',
                    confirmButtonColor: '#2563eb',
                    confirmButtonText: 'ตกลง'
                });
                return;
            }

            userData = {
                empId: empId,
                name: document.getElementById('emp-name').value.trim(),
                department: document.getElementById('emp-dept').value.trim(),
                testType: document.getElementById('test-type').value
            };

            document.getElementById('loading').classList.remove('hidden');

            try {
                const completedTests = await completedTestsPromise;
                const hasTaken = completedTests.some(record => record.empId === empId && record.testType === userData.testType);
                
                document.getElementById('loading').classList.add('hidden');

                if (hasTaken) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'คุณทำแบบทดสอบไปแล้ว!',
                        text: `รหัสพนักงาน ${empId} ได้ทำการสอบ ${userData.testType} ไปแล้ว ไม่สามารถทำซ้ำได้`,
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'ตกลง'
                    });
                    return;
                }

                startQuiz();
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                startQuiz();
            }
        });

        function startQuiz() {
            document.getElementById('register-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            
            currentQuestions = shuffle(JSON.parse(JSON.stringify(quizData)));
            currentQuestionIndex = 0;
            score = 0;
            
            // แจ้งเตือนก่อนเริ่ม
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: 'เริ่มจับเวลา!',
                text: 'คุณมีเวลาข้อละ 60 วินาที',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });

            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 60;
            document.getElementById('time-text').innerText = `${timeLeft} วิ`;
            
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('question-counter').innerHTML = `<i class="fas fa-question-circle text-blue-500 mr-1"></i> ข้อ ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-text').innerText = q.q;

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            const shuffledChoices = shuffle([...q.choices]);
            
            shuffledChoices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-gray-100 bg-gray-50 hover:bg-blue-50 hover:border-blue-300 transition-all duration-200 text-gray-700 flex items-start group shadow-sm";
                
                // ใส่ตัวอักษร ก, ข, ค, ง ไว้ด้านหน้า
                const prefix = String.fromCharCode(161 + index); // 161 คือ ก.ไก่ ในรหัส TIS-620/Unicode แบบคร่าวๆ (เราใช้การเจน A,B,C,D ก็ได้ แต่ในที่นี้จะใช้แค่ bullet สวยๆ)
                
                btn.innerHTML = `
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-white border border-gray-300 flex items-center justify-center mr-3 group-hover:border-blue-400 group-hover:bg-blue-100 transition-colors">
                        <span class="text-sm font-bold text-gray-500 group-hover:text-blue-600">${index + 1}</span>
                    </div>
                    <span class="mt-1">${choice}</span>
                `;
                btn.onclick = () => selectAnswer(choice, q.ans);
                choicesContainer.appendChild(btn);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-text').innerText = `${timeLeft} วิ`;
                
                // เปลี่ยนสีเวลาเมื่อเหลือน้อยกว่า 10 วิ
                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('animate-pulse', 'bg-red-100');
                } else {
                    document.getElementById('timer').classList.remove('animate-pulse', 'bg-red-100');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // หมดเวลา เด้ง Toast เตือน
                    Swal.fire({
                        toast: true,
                        position: 'top',
                        icon: 'error',
                        title: 'หมดเวลา!',
                        text: 'ข้ามไปยังข้อถัดไป',
                        showConfirmButton: false,
                        timer: 2000
                    });
                    nextQuestion(); 
                }
            }, 1000);
        }

        function selectAnswer(selected, correct) {
            clearInterval(timerInterval);
            if (selected === correct) score++;
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        async function finishQuiz() {
            // 1. ซ่อนหน้าข้อสอบ และแสดงหน้า "ผลคะแนน" ทันทีโดยไม่ต้องรอโหลด
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            
            // อัปเดตตัวเลขคะแนนให้แสดงผลทันที
            document.getElementById('score-display').innerText = score;
            document.getElementById('total-display').innerText = currentQuestions.length;

            // 2. แสดง Toast แจ้งเตือนเล็กๆ มุมขวาบนว่ากำลังส่งข้อมูล
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timerProgressBar: true,
            });
            
            Toast.fire({
                icon: 'info',
                title: 'กำลังบันทึกคะแนนลงระบบ...'
            });

            userData.score = score;

            // 3. แอบส่งข้อมูลไปบันทึกที่ Google Sheet แบบเบื้องหลัง
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(userData)
                });
                const result = await response.json();
                
                if(result.status === 'duplicate') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'พบข้อมูลซ้ำ',
                        text: `รหัสพนักงาน ${userData.empId} ได้ทำการสอบ ${userData.testType} ไปแล้ว ข้อมูลรอบนี้จะไม่ถูกบันทึกซ้ำ`,
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'รับทราบ'
                    });
                    return;
                }
                
                // 4. เมื่อ Google Sheet บันทึกเสร็จเรียบร้อย (ประมาณ 2-3 วิ) จะขึ้นสีเขียวแจ้งเตือน
                Toast.fire({
                    icon: 'success',
                    title: 'บันทึกข้อมูลสำเร็จ!',
                    timer: 3000
                });

                // ยิงพลุฉลองถ้าได้คะแนนเต็ม (หน่วงเวลาเล็กน้อยให้ Toast บันทึกสำเร็จขึ้นก่อน)
                if (score === currentQuestions.length) {
                    setTimeout(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'ยอดเยี่ยมมาก!',
                            text: 'คุณได้คะแนนเต็ม',
                            confirmButtonColor: '#10b981',
                            confirmButtonText: 'ตกลง'
                        });
                    }, 1000);
                }
                
            } catch (error) {
                Toast.fire({
                    icon: 'error',
                    title: 'บันทึกไม่สำเร็จ กรุณาแจ้งผู้ดูแลระบบ',
                    timer: 5000
                });
            }
        }
    </script>
</body>
</html>
